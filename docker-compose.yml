services:
  # -------------------------------------------------------------
  # DATABASES & INFRASTRUCTURE
  # -------------------------------------------------------------

  # 1. Identity & Access Database (Port 5434)
  scms_postgres_identity:
    image: postgres:16-alpine
    container_name: scms_postgres_identity
    restart: always
    environment:
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: scms_secure_pass_2026
      POSTGRES_DB: sms_identity
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - identity_data:/var/lib/postgresql/data
      - ./database/postgres/init-identity.sql:/docker-entrypoint-initdb.d/init-identity.sql:ro
    networks:
      - scms-network

  # 2. Academic Catalog Database (Port 5435) - SMS-021 SSOT
  scms_postgres_catalog:
    image: postgres:16-alpine
    container_name: scms_postgres_catalog
    restart: always
    environment:
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: scms_secure_pass_2026
      POSTGRES_DB: sms_catalog
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - catalog_data:/var/lib/postgresql/data
      - ./database/postgres/init-catalog.sql:/docker-entrypoint-initdb.d/init-catalog.sql:ro
    networks:
      - scms-network

  # 3. Requirements & Deadlines Database (Port 5436)
  scms_postgres_requirements:
    image: postgres:16-alpine
    container_name: scms_postgres_requirements
    restart: always
    environment:
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: scms_secure_pass_2026
      POSTGRES_DB: sms_requirements
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - requirements_data:/var/lib/postgresql/data
      - ./database/postgres/init-requirements.sql:/docker-entrypoint-initdb.d/init-requirements.sql:ro
    networks:
      - scms-network

  # 4. Submissions & Review Queue Database (Port 5437)
  scms_postgres_submissions:
    image: postgres:16-alpine
    container_name: scms_postgres_submissions
    restart: always
    environment:
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: scms_secure_pass_2026
      POSTGRES_DB: sms_submissions
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - submissions_data:/var/lib/postgresql/data
      - ./database/postgres/init-submissions.sql:/docker-entrypoint-initdb.d/init-submissions.sql:ro
    networks:
      - scms-network

  # 5. Tamper-Evident Audit Log Database (Port 5438) - SMS-014
  scms_postgres_audit:
    image: postgres:16-alpine
    container_name: scms_postgres_audit
    restart: always
    environment:
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: scms_secure_pass_2026
      POSTGRES_DB: sms_audit
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - audit_data:/var/lib/postgresql/data
      - ./database/postgres/init-audit.sql:/docker-entrypoint-initdb.d/init-audit.sql:ro
    networks:
      - scms-network

  # 6. Compliance Monitoring & Analytics Database (Port 5439) - SMS-006, SMS-012, SMS-037
  scms_postgres_compliance:
    image: postgres:16-alpine
    container_name: scms_postgres_compliance
    restart: always
    environment:
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: scms_secure_pass_2026
      POSTGRES_DB: sms_compliance
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - compliance_data:/var/lib/postgresql/data
      - ./database/postgres/init-compliance.sql:/docker-entrypoint-initdb.d/init-compliance.sql:ro
    networks:
      - scms-network

  # MongoDB (GridFS syllabus documents & dynamic JSON rubric forms)
  mongo:
    image: mongo:7.0
    container_name: scms-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: scms_admin
      MONGO_INITDB_ROOT_PASSWORD: scms_mongo_pass_2026
      MONGO_INITDB_DATABASE: scms_documents
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - scms-network

  # Redis (Pub/Sub live event bus & BullMQ queues)
  redis:
    image: redis:7-alpine
    container_name: scms-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scms-network

  # Adminer (Web GUI on Port 8080)
  adminer:
    image: adminer:latest
    container_name: scms-adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - scms-network
    depends_on:
      - scms_postgres_identity
      - scms_postgres_catalog
      - scms_postgres_requirements
      - scms_postgres_submissions
      - scms_postgres_audit
      - scms_postgres_compliance

  # -------------------------------------------------------------
  # NODE.JS MICROSERVICES (CONTAINERIZED)
  # -------------------------------------------------------------

  # Microservice 1: Identity & Access Service
  identity-service:
    build:
      context: .
      dockerfile: apps/identity-service/Dockerfile
    container_name: scms-identity-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=scms_postgres_identity
      - DB_PORT=5432
      - DB_USER=scms_admin
      - DB_PASSWORD=scms_secure_pass_2026
      - DB_NAME=sms_identity
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
      - CLIENT_ORIGIN=http://localhost:5173
      - CLERK_SECRET_KEY=sk_test_placeholder
      - CLERK_ISSUER_URL=https://wondrous-lionfish-5125.clerk.accounts.dev
    networks:
      - scms-network
    depends_on:
      - scms_postgres_identity

  # Microservice 2: Requirements & Academic Deadlines Service
  requirements-service:
    build:
      context: .
      dockerfile: apps/requirements-service/Dockerfile
    container_name: scms-requirements-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=scms_postgres_requirements
      - DB_PORT=5432
      - DB_USER=scms_admin
      - DB_PASSWORD=scms_secure_pass_2026
      - DB_NAME=sms_requirements
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
      - CATALOG_DB_HOST=scms_postgres_catalog
      - CATALOG_DB_PORT=5432
    networks:
      - scms-network
    depends_on:
      - scms_postgres_requirements
      - scms_postgres_catalog

  # Microservice 3: Submissions & Syllabus GridFS Service
  submission-service:
    build:
      context: .
      dockerfile: apps/submission-service/Dockerfile
    container_name: scms-submission-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_HOST=scms_postgres_submissions
      - DB_PORT=5432
      - DB_USER=scms_admin
      - DB_PASSWORD=scms_secure_pass_2026
      - DB_NAME=sms_submissions
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
      - MONGO_URI=mongodb://scms_admin:scms_mongo_pass_2026@scms-mongo:27017/scms_documents?authSource=admin
      - AUDIT_SERVICE_HOST=audit-log-service
      - AUDIT_SERVICE_PORT=3004
    networks:
      - scms-network
    depends_on:
      - scms_postgres_submissions
      - mongo

  # Microservice 4: Tamper-Evident Audit Log Service
  audit-log-service:
    build:
      context: .
      dockerfile: apps/audit-log-service/Dockerfile
    container_name: scms-audit-log-service
    restart: always
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - DB_HOST=scms_postgres_audit
      - DB_PORT=5432
      - DB_USER=scms_admin
      - DB_PASSWORD=scms_secure_pass_2026
      - DB_NAME=sms_audit
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
    networks:
      - scms-network
    depends_on:
      - scms_postgres_audit

  # Microservice 5: Compliance Monitoring & CCMS Push Service
  compliance-monitoring-service:
    build:
      context: .
      dockerfile: apps/compliance-monitoring-service/Dockerfile
    container_name: scms-compliance-monitoring-service
    restart: always
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DB_HOST=scms_postgres_compliance
      - DB_PORT=5432
      - DB_USER=scms_admin
      - DB_PASSWORD=scms_secure_pass_2026
      - DB_NAME=sms_compliance
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
      - REDIS_URL=redis://scms-redis:6379
      - REQUIREMENTS_SERVICE_URL=http://requirements-service:3002/api/v1/integrations/scms/catalog-events
    networks:
      - scms-network
    depends_on:
      - scms_postgres_compliance
      - redis

  # Microservice 6: Academic Catalog & Curriculum SSOT Service
  academic-catalog-service:
    build:
      context: .
      dockerfile: apps/academic-catalog-service/Dockerfile
    container_name: scms-academic-catalog-service
    restart: always
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - DB_HOST=scms_postgres_catalog
      - DB_PORT=5432
      - DB_USER=scms_admin
      - DB_PASSWORD=scms_secure_pass_2026
      - DB_NAME=sms_catalog
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
    networks:
      - scms-network
    depends_on:
      - scms_postgres_catalog

  # Microservice 0: Ingress API Gateway Router
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: scms-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_PORT=3000
      - LOCAL_DEV=false
      - NODE_ENV=production
      - JWT_SECRET=pup_scms_super_secret_jwt_key_sprint1_2026
    networks:
      - scms-network
    depends_on:
      - identity-service
      - requirements-service
      - submission-service
      - audit-log-service
      - compliance-monitoring-service
      - academic-catalog-service

networks:
  scms-network:
    name: capstone-acas_scms-network
    driver: bridge

volumes:
  identity_data:
  catalog_data:
  requirements_data:
  submissions_data:
  audit_data:
  compliance_data:
  mongo_data:
  redis_data:
