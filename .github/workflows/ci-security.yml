name: CI & Security Compliance Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # =========================================================================
  # 1. SECRET & CREDENTIAL SCAN (TruffleHog)
  # =========================================================================
  detect-secrets:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Omitting identical base/head avoids the "BASE and HEAD commits are the same" error on default branch push
      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || '' }}
          head: ${{ github.event_name == 'pull_request' && 'HEAD' || '' }}
          extra_args: --only-verified

  # =========================================================================
  # 2. DEPENDENCY VULNERABILITY SCAN (Trivy)
  # =========================================================================
  dependency-and-vulnerability-scan:
    name: Dependency & SAST Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Displays a clean vulnerability table in the Actions console for developer review
      - name: Run Trivy Vulnerability Scanner (Console Table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # Generates SARIF for GitHub Security Tab
      - name: Generate Trivy SARIF Report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # continue-on-error prevents failure if GitHub Advanced Security (GHAS) is disabled on private repos
      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  # =========================================================================
  # 3. CODEQL STATIC CODE ANALYSIS (SAST)
  # =========================================================================
  codeql-analysis:
    name: CodeQL Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      # continue-on-error ensures the build passes even if Code Scanning upload is not enabled in repo settings
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:javascript-typescript"

  # =========================================================================
  # 4. FRONTEND BUILD & CLIENT VALIDATION
  # =========================================================================
  frontend-validation:
    name: Frontend Syntax & Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Client Dependencies
        run: |
          cd apps/client
          npm install --package-lock-only || true
